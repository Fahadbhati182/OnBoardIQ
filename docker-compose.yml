
services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: onboardiq-kafka
    hostname: kafka

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - onboardiq-network

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: onboardiq-backend

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 3000
      AI_BACKEND_URL: http://ai:8000
      KAFKA_DOMAIN: kafka:9092
      DOCUMENT_STORAGE_PATH: /app/storage/documents

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - document_data:/app/storage/documents

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - onboardiq-network

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    restart: unless-stopped

  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile

    container_name: onboardiq-ai

    env_file:
      - ./AI/.env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BACKEND_URL: http://backend:3000

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy

    networks:
      - onboardiq-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 5m

    restart: unless-stopped

volumes:
  kafka_data:
  document_data:

networks:
  onboardiq-network:
    driver: bridge
